services:

  db:
    image: pgvector/pgvector:pg18-3.0.0-alpha.12
    environment:
      POSTGRES_DB: ${DB_NAME:-muolana}
      POSTGRES_USER: ${DB_USER:-muolana}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-muolana} -d ${DB_NAME:-muolana}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped


volumes:
  pgdata:

spring.application.name=muolana

# LLM provider
spring.profiles.active=${AI_PROVIDER:gemini},local

# DataSource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.datasource.hikari.auto-commit=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=15
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# JWT
jwt.public-key=${JWT_PUBLIC_KEY:classpath:certs/public.pem}
jwt.private-key=${JWT_PRIVATE_KEY:classpath:certs/private.pem}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Proxy / forwarded headers
server.forward-headers-strategy=framework

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.ignore-migration-patterns=*:missing

# Docker Compose
spring.docker.compose.enabled=false

# Multipart
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Disable OpenAI-only auxiliary models so they don't fail when OPENAI_API_KEY is absent.
# The openai profile can re-enable any it needs.
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none

# Embedding — Google GenAI gemini-embedding-001 at 1536 dims (default for all profiles)
# The openai profile overrides these to use OpenAI embedding instead.
spring.ai.model.embedding=none
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=1536
spring.ai.google.genai.embedding.text.task-type=RETRIEVAL_QUERY

# PgVector
spring.ai.vectorstore.pgvector.schema-name=legal_documents
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.initialize-schema=false

# Upload
app.upload.dir=./uploads

# RAG pipeline
app.rag.hallucination-threshold=0.3
app.rag.top-k=10

# Logging
logging.level.com.lahat.muolana.conversation=INFO
logging.level.com.lahat.muolana.rag=DEBUG

# Admin seed
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.password=${ADMIN_PASSWORD:Admin@2026!}
app.admin.full-name=${ADMIN_FULL_NAME:System Admin}

# Google Gemini chat provider
# Embedding is configured in application.properties (shared across all profiles).
spring.ai.model.chat=google-genai

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_CHAT_MODEL:gemini-2.5-flash}

app.ai.model-name=${GEMINI_CHAT_MODEL:gemini-2.5-flash}

# Fix for deprecated text-embedding-004 model
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
